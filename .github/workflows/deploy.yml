name: Deploy student management system

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: student-management-production
  cancel-in-progress: true

env:
  APP_NAME: student-management-system
  APP_DIR: /home/ubuntu/myproject
  APP_PORT: 3000

jobs:
  deploy:
    name: Test and Deploy to EC2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run checks
        run: npm run check

      - name: Run tests
        run: npm test

      - name: Validate secrets
        shell: bash
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          [ -n "$EC2_HOST" ] || { echo "EC2_HOST missing"; exit 1; }
          [ -n "$EC2_USER" ] || { echo "EC2_USER missing"; exit 1; }
          [ -n "$SSH_PRIVATE_KEY" ] || { echo "SSH_PRIVATE_KEY missing"; exit 1; }

      - name: Configure SSH
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          printf "%s\n" "$SSH_PRIVATE_KEY" | tr -d '\r' > "$HOME/.ssh/deploy_key"

          chmod 600 "$HOME/.ssh/deploy_key"

          ssh-keyscan -H "$EC2_HOST" >> "$HOME/.ssh/known_hosts"

      - name: Test SSH connection
        shell: bash
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh \
            -i "$HOME/.ssh/deploy_key" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=accept-new \
            "$EC2_USER@$EC2_HOST" \
            "hostname && whoami"

      - name: Deploy application
        shell: bash
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          APP_NAME: ${{ env.APP_NAME }}
          APP_DIR: ${{ env.APP_DIR }}
          APP_PORT: ${{ env.APP_PORT }}
        run: |
          ssh \
            -i "$HOME/.ssh/deploy_key" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=accept-new \
            "$EC2_USER@$EC2_HOST" << EOF

          set -e

          export PM2_HOME=/home/ubuntu/.pm2
          export PATH=\$PATH:/usr/bin

          cd $APP_DIR

          git pull origin main

          npm ci --omit=dev

          if pm2 describe $APP_NAME >/dev/null 2>&1; then
            pm2 restart $APP_NAME --update-env
          else
            pm2 start npm --name $APP_NAME -- start
          fi

          pm2 save

          pm2 list
          EOF