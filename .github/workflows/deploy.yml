name: Deploy student management system

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: student-management-production
  cancel-in-progress: true

env:
  APP_NAME: student-management-system
  APP_DIR: /home/ubuntu/myproject
  APP_PORT: 3000

jobs:
  deploy:
    name: Test and deploy to EC2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Code test
        run: |
          npm ci
          npm run check
          npm test

      - name: Validate required secrets
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          if [ -z "$EC2_HOST" ]; then
            echo "Missing required GitHub secret: EC2_HOST"
            exit 1
          fi

          if [ -z "$EC2_USER" ]; then
            echo "Missing required GitHub secret: EC2_USER"
            exit 1
          fi

          if [ -z "$SSH_PRIVATE_KEY" ]; then
            echo "Missing required GitHub secret: SSH_PRIVATE_KEY"
            exit 1
          fi

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Test SSH connection to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o BatchMode=yes \
            -o ConnectTimeout=30 \
            -o IdentitiesOnly=yes \
            "$EC2_USER@$EC2_HOST" \
            "echo 'SSH connection successful' && hostname && whoami"

      - name: Deploy application
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o BatchMode=yes \
            -o ConnectTimeout=30 \
            -o IdentitiesOnly=yes \
            "$EC2_USER@$EC2_HOST" << 'EOF'
          set -e

          export PM2_HOME=/home/ubuntu/.pm2
          export PATH=$PATH:/usr/bin

          cd /home/ubuntu/myproject

          git pull origin main

          npm ci --omit=dev

          echo "===== PM2 Before Restart ====="
          pm2 list

          pm2 restart student-management-system --update-env

          pm2 save

          echo "===== PM2 After Restart ====="
          pm2 list
          EOF