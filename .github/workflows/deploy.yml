name: Deploy to EC2

on:
      - name: Check application
        run: npm run check

      - name: Run tests
        run: npm test

      - name: Debug SSH secret
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          echo "Length: ${#SSH_PRIVATE_KEY}"
          echo "$SSH_PRIVATE_KEY" | head -1
          echo "$SSH_PRIVATE_KEY" | tail -1

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: student-management-production
  cancel-in-progress: true

env:
  APP_NAME: student-management-system
  APP_DIR: /home/ubuntu/myproject
  # Node listens privately on localhost:3000. Nginx exposes the app on ports 80/443.
  APP_PORT: 3000

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Check application
        run: npm run check

      - name: Run tests
        run: npm test

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/ubuntu/myproject
            git pull origin main
            npm ci
            pm2 restart myapp
            pm2 save
